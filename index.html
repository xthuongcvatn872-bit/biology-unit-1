<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biology English Vocabulary - Unit 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <header class="app-header">
      <span class="badge">Unit 1 &bull; Molecular Genetics</span>
      <h1>Biology English Vocabulary</h1>
      <p class="subtitle">Interactive Digital Learning Material</p>
    </header>

    <div class="counter-wrap">
      <span class="counter-badge"><strong id="currentNumber">1</strong> / 9</span>
    </div>

    <main class="main-content">
      <!-- Khung hiển thị Slide -->
      <section class="slide-section">
        <div class="slide-frame">
          <img id="slideImage" src="001_DNA.png" alt="Biology Slide">
        </div>
      </section>

      <!-- Khung Audio & Video song song cân đối -->
      <div class="media-grid">
        <section class="media-card">
          <div class="media-title">
            <span class="icon">🔊</span>
            <h3>Listen & Repeat</h3>
          </div>
          <audio id="audioPlayer" controls preload="metadata">
            <source id="audioSource" src="001_DNA.mp3" type="audio/mpeg">
            Trình duyệt không hỗ trợ phát âm thanh.
          </audio>
        </section>

        <section class="media-card">
          <div class="media-title">
            <span class="icon">🎥</span>
            <h3>Teacher's Guide</h3>
          </div>
          <div class="video-container">
            <video id="videoPlayer" controls playsinline preload="metadata">
              <source id="videoSource" src="001_DNA.mp4" type="video/mp4">
              Trình duyệt không hỗ trợ phát video.
            </video>
          </div>
        </section>
      </div>

      <!-- Thanh điều khiển chuyển bài -->
      <nav class="nav-controls" aria-label="Điều hướng từ vựng">
        <button id="previousButton" type="button" class="btn btn-prev">
          <span class="arrow">◀</span> Previous
        </button>
        <button id="nextButton" type="button" class="btn btn-next">
          Next <span class="arrow">▶</span>
        </button>
      </nav>
    </main>

    <footer class="app-footer">
      <p>Biology Digital Learning Material &bull; THPT Chuyên Thái Nguyên</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
